<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Demo interactiva: plataforma de tours en Panamá con reservas, pagos, agente IA y panel admin.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Travy · Tours en Panamá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F7F7; --ink:#222222; --muted:#6A6A6A; --line:#E4E4E4; --field:#B0B0B0;
  --sea:#222222; --sea-soft:#F4F4F4; --mola:#E0314B; --mola-ink:#FFFFFF; --sun:#222222;
  --grad:linear-gradient(to right,#EE3F58 0%,#E0314B 50%,#CC2346 100%);
  --ok:#008A05; --ok-soft:#E6F4E7; --warn:#B45309; --warn-soft:#FEF3E2; --bad:#C13515; --bad-soft:#FDECE8; --info:#1D5FBF; --info-soft:#E8F0FC;
  --bar:#222222; --bar-ink:#F2F2F2; --bar-muted:#A8A8A8; --bar-sel:#3D3D3D; --bar-lv:#383838;
  --shadow:0 6px 16px rgba(0,0,0,.12);
  --display:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --code:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141414; --surface:#1E1E1E; --surface-2:#262626; --ink:#F2F2F2; --muted:#A3A3A3; --line:#333333;
    --sea:#F2F2F2; --sea-soft:#2A2A2A; --mola:#FF5068; --sun:#F2F2F2; --field:#555555;
    --ok:#4CC97A; --ok-soft:#12301C; --warn:#F0A94A; --warn-soft:#3A2A12; --bad:#FF6B57; --bad-soft:#3B1A14; --info:#7AAEF5; --info-soft:#15263F;
    --bar:#0A0A0A; --bar-sel:#2C2C2C; --bar-lv:#262626; --shadow:0 6px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#141414; --surface:#1E1E1E; --surface-2:#262626; --ink:#F2F2F2; --muted:#A3A3A3; --line:#333333;
    --sea:#F2F2F2; --sea-soft:#2A2A2A; --mola:#FF5068; --sun:#F2F2F2; --field:#555555;
    --ok:#4CC97A; --ok-soft:#12301C; --warn:#F0A94A; --warn-soft:#3A2A12; --bad:#FF6B57; --bad-soft:#3B1A14; --info:#7AAEF5; --info-soft:#15263F;
    --bar:#0A0A0A; --bar-sel:#2C2C2C; --bar-lv:#262626; --shadow:0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar);color:var(--bar-ink)}
.demobar .wrap{display:flex;align-items:center;gap:16px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.demobar .tag{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bar-muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs button{border:0;background:transparent;color:var(--bar-muted);padding:8px 12px;border-radius:8px;white-space:nowrap;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--bar-sel);color:#fff}
.tabs button .lv{font:600 10px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--bar-lv);color:#D0D0D0}
.tabs button[aria-selected="true"] .lv{background:var(--mola);color:#fff}

/* site header */
.site-h{background:var(--surface);border-bottom:1px solid var(--line)}
.site-h .wrap{display:flex;align-items:center;gap:24px;min-height:76px}
.logo{display:flex;align-items:center;gap:6px;font:800 26px/1 var(--display);letter-spacing:-.04em;background:none;border:0;padding:0;color:var(--mola)}
.logo svg{width:30px;height:30px}
.site-h nav{display:flex;gap:4px;color:var(--ink);font-weight:600;flex:1;justify-content:center}
.site-h nav span{padding:10px 14px;border-radius:999px}
.site-h nav span:hover{background:var(--surface-2)}
.site-h nav span{cursor:default}
@media (max-width:760px){.site-h nav{display:none}.site-h .wrap{justify-content:space-between}}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .15s ease,background .15s}
.btn:active{transform:translateY(1px)}
.btn-mola{background:var(--grad);color:var(--mola-ink)}
.btn-mola:hover{filter:brightness(1.05)}
.btn-sea{background:var(--sea);color:var(--surface)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-line{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.btn-wa{background:#1FAF5A;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.spark{width:16px;height:16px}

/* hero */
.hero{padding-block:44px 28px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.eyebrow{font:700 14px/1 var(--body);color:var(--mola)}
.hero h1{font-size:clamp(34px,5vw,58px);font-weight:800;letter-spacing:-.04em;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--mola)}
.hero .lede{color:var(--muted);font-size:17px;max-width:48ch;margin-top:16px}
.search{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 16px;display:grid;grid-template-columns:1fr 1fr auto;gap:0;align-items:center;box-shadow:var(--shadow)}
.search .field + .field{border-left:1px solid var(--line)}
.search .field{padding:6px 16px}
.search .btn{border-radius:999px;padding:14px 22px}
@media (max-width:560px){.search{grid-template-columns:1fr;border-radius:20px;padding:8px;gap:6px}.search .field + .field{border-left:0;border-top:1px solid var(--line)}}
.field{display:flex;flex-direction:column;gap:4px;padding:6px 10px}
.field label,.lbl{font:700 12px/1.2 var(--body);color:var(--ink)}
.field select,.field input,.inp{border:0;background:transparent;padding:2px 0;font-weight:500;color:var(--muted);outline:none;width:100%}
.inp-box{border:1px solid var(--field);background:var(--surface);border-radius:8px;padding:10px 12px;font-weight:500;width:100%}
.inp-box:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);outline:none}
.mosaic{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:170px 170px;gap:10px}
.mosaic .tile{border-radius:12px;overflow:hidden;position:relative}
.mosaic .tile:first-child{grid-row:span 2}
.mosaic .tile span{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.95);color:#222;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.scene{display:block;width:100%;height:100%}
@media (max-width:520px){.mosaic{grid-template-rows:120px 120px}}

.trust{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px;color:var(--muted);font-size:14px}
.trust b{color:var(--ink)}

/* catalog */
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-size:clamp(26px,3.2vw,36px);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 22px}
@media (max-width:940px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:transparent;border:0;display:flex;flex-direction:column;text-align:left;padding:0}
.card .img{aspect-ratio:20/17;position:relative;max-width:100%;border-radius:12px;overflow:hidden}
.card .img .scene{transition:transform .35s ease}
.card:hover .img .scene{transform:scale(1.04)}
.badge{position:absolute;top:12px;left:12px;background:#fff;color:#222;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.badge.hot{background:#fff;color:#222}
.card .body{padding:12px 2px 0;display:flex;flex-direction:column;gap:3px;flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.card h3{font-size:16px;font-weight:700;letter-spacing:0;line-height:1.3}
.card .foot{display:flex;justify-content:space-between;align-items:end;margin-top:auto;padding-top:4px}
.price small{display:block;font:500 13px/1 var(--body);color:var(--muted);margin-bottom:4px}
.price b{font:700 17px/1 var(--display)}
.price i{font-style:normal;color:var(--muted);font-size:14px}
.stars{color:var(--ink);font-weight:600;font-size:14px}
.stars span{color:var(--muted);font-weight:500}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.why{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-block:48px;margin-top:40px;border-top:1px solid var(--line)}
@media (max-width:800px){.why{grid-template-columns:1fr}}
.why h4{font-size:18px;margin-bottom:6px}
.why p{color:var(--muted)}
.foot-site{border-top:1px solid var(--line);background:var(--surface-2);padding-block:24px;color:var(--muted);font-size:14px}

/* detail */
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:18px 0 12px;display:inline-flex;gap:6px}
.d-hero{border-radius:12px;overflow:hidden;height:340px;position:relative}
@media (max-width:600px){.d-hero{height:220px}}
.d-grid{display:grid;grid-template-columns:1fr 380px;gap:32px;margin-top:24px;align-items:start;padding-bottom:48px}
@media (max-width:960px){.d-grid{grid-template-columns:1fr}}
.d-grid h1{font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-.03em}
.d-desc{color:var(--muted);font-size:16px;max-width:62ch;margin-top:14px}
.block{margin-top:28px}
.block h3{font-size:20px;margin-bottom:12px}
.itin{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.itin li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding-left:16px;position:relative}
.itin li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--mola)}
.itin .num{color:var(--muted);font-size:13px;padding-top:1px}
.inc{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;list-style:none;padding:0;margin:0}
@media (max-width:600px){.inc{grid-template-columns:1fr}}
.inc li{display:flex;gap:8px}
.inc li::before{content:"✓";color:var(--ok);font-weight:700}
.inc.no li::before{content:"–";color:var(--muted)}

.book{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.book-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.book-tabs button{border:0;background:var(--surface-2);padding:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.book-tabs button small{font:600 10px/1 var(--mono);letter-spacing:.06em}
.book-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.book-in{padding:18px;display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--field);border-radius:8px;padding:6px 8px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--field);background:var(--surface);color:var(--ink);font-weight:600}
.stepper button[disabled]{opacity:.3;cursor:not-allowed}
.stepper b{font-variant-numeric:tabular-nums}
.stepper-wrap{display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:12px}
.total b{font:800 26px/1 var(--display)}

.cal-h{display:flex;justify-content:space-between;align-items:center}
.cal-h b{font-family:var(--display);font-size:17px;text-transform:capitalize}
.cal-h button{border:0;background:var(--surface);border-radius:50%;width:32px;height:32px}
.cal-h button:hover{background:var(--surface-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font:600 10px/1 var(--mono);text-align:center;color:var(--muted);padding:4px 0}
.day{border:1px solid transparent;background:var(--surface);border-radius:10px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px}
.day b{font-size:14px}
.day small{font:600 9px/1 var(--body);color:var(--ok)}
.day:not(.off):not(.sold):not(.sel):hover{border-color:var(--ink)}
.day.low small{color:var(--warn)}
.day.off{background:transparent;color:var(--muted);opacity:.45;cursor:not-allowed}
.day.sold{background:transparent;cursor:not-allowed}
.day.sold b{text-decoration:line-through;color:var(--muted)}
.day.sold small{color:var(--bad)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel small{color:var(--bg)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

.wa-bubble{background:#DCF8C6;color:#102015;border-radius:12px 12px 12px 2px;padding:10px 12px;font-size:14px;position:relative}
.wa-bubble small{display:block;text-align:right;color:#5a7560;font-size:11px;margin-top:4px}
.success{display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:700}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,12,17,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:520px;width:100%;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:20px}
.x{border:0;background:transparent;border-radius:50%;width:32px;height:32px;font-size:18px}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.line-item{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.line-item span:first-child{color:var(--muted)}
.pay-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay-opts button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pay-opts button small{font-weight:500;color:var(--muted);font-size:11px}
.pay-opts button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--sea-soft)}
.log{background:#1A1A1A;color:#D8F0E0;border-radius:10px;padding:12px;font:12px/1.7 var(--code);overflow-x:auto}
.log .k{color:#7FB6FF}.log .d{color:#6D8793}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--mola);animation:spin .8s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* agent */
.agent{display:grid;grid-template-columns:1fr 320px;gap:24px;padding-block:28px 48px}
@media (max-width:900px){.agent{grid-template-columns:1fr}}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:620px;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center}
.avatar svg{width:22px;height:22px}
.chat-h b{display:block;font-family:var(--display);font-size:17px}
.chat-h small{color:var(--ok);font-size:12px;font-weight:600}
.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:640px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px}
.msg.bot{background:var(--surface-2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--sea);color:var(--surface);border-bottom-right-radius:4px;align-self:flex-end}
.msg.plan{max-width:100%;width:100%;background:var(--surface);border:1px solid var(--line)}
.qr{display:flex;flex-wrap:wrap;gap:8px}
.qr button{border:1px solid var(--line);color:var(--ink);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px}
.qr button:hover{border-color:var(--ink)}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1}
.pday{display:grid;grid-template-columns:74px 56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pday:first-of-type{border-top:0}
.pday .th{height:44px;border-radius:8px;overflow:hidden}
.pday .d{font:600 11px/1.3 var(--mono);color:var(--muted);text-transform:uppercase}
.pday b{display:block;font-size:15px}
.pday .s{font-size:12px;color:var(--ok)}
@media (max-width:520px){.pday{grid-template-columns:48px 1fr auto}.pday .d{grid-column:1/-1}}
.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h4{font-size:16px;margin-bottom:10px}
.step{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 0}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:600 12px/1 var(--mono);color:var(--muted)}
.step.done .n{background:var(--ok);color:#fff}
.step.now .n{background:var(--mola);color:#fff}
.step p{font-size:14px}
.step small{color:var(--muted);font-size:12px;display:block}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b.pending{color:var(--muted);font-weight:500}

/* admin */
.admin{padding-block:28px 48px}
.admin-top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.admin-top h2{font-size:30px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{font:600 13px/1.2 var(--body);color:var(--muted)}
.kpi b{display:block;font:700 30px/1.1 var(--display);margin-top:8px}
.kpi small{color:var(--ok);font-weight:600;font-size:12px}

.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.switch{position:relative;width:40px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}

/* inventory: seeded seats per tour per day (capacity 12) */
const inv = {};
function seats(id, k) {
  const key = id + '|' + k;
  if (!(key in inv)) {
    let h = 7; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const r = h % 13;
    inv[key] = r < 2 ? 0 : [2,3,5,6,8,9,10,12,4,7,11][h % 11];
  }
  return inv[key];
}

const Q = [

  { key:'who', ask:'Perfecto. ¿Con quién viajas?', opts:[['En pareja','pareja'],['Con amigos (4)','amigos'],['En familia con niños','familia'],['Solo','solo']] },
  { key:'budget', ask:'¿Cuánto quieres gastar por persona en tours, más o menos?', opts:[['Hasta $200','200'],['$200 a $450','450'],['Sin tope','9999']] }
];
const LBL = { playa:'Playa e islas', naturaleza:'Selva y montaña', ciudad:'Ciudad y cultura', mix:'Un poco de todo', pareja:'En pareja', amigos:'Con amigos', familia:'Familia con niños', solo:'Solo', '200':'Hasta $200 p/p', '450':'$200–$450 p/p', '9999':'Sin tope' };
function chatInit() { S.chat = { msgs:[{ from:'bot', html:esc(Q[0].ask), opts:Q[0].opts }], step:0, ans:{}, typing:false, plan:null }; }
function paxOf(who) { return { pareja:[2,0], amigos:[4,0], familia:[2,2], solo:[1,0] }[who] || [2,0]; }
function buildPlan(a) {
  const [ad, ni] = paxOf(a.who), n = ad + ni, budget = Number(a.budget);
  let pool = tours.filter(t => t.pub);
  let picks = [];
  if (a.vibe === 'mix') {
    for (const v of ['ciudad','naturaleza','playa']) {
      const c = pool.filter(t => t.vibe === v).sort((x,y)=>y.rating-x.rating || x.adulto-y.adulto);
      const hit = c.find(t => picks.reduce((s,p)=>s+p.adulto,0) + t.adulto <= budget) || c.sort((x,y)=>x.adulto-y.adulto)[0];
      if (hit) picks.push(hit);
    }
  } else {
    const c = pool.filter(t => t.vibe === a.vibe || (a.vibe==='ciudad' && t.cat==='Cultura')).sort((x,y)=>y.rating-x.rating || x.adulto-y.adulto);
    for (const t of c) { if (picks.length < 3 && picks.reduce((s,p)=>s+p.adulto,0) + t.adulto <= budget && !(t.kind==='lagoon' && picks.some(p=>p.dest===t.dest && p.kind!=='lagoon') )) picks.push(t); }
    if (picks.length < 2) picks = c.sort((x,y)=>x.adulto-y.adulto).slice(0,2);
    if (a.vibe==='ciudad' && picks.length < 3) { const g = pool.find(t=>t.id===6); if (g && !picks.includes(g)) picks.push(g); }
  }
  if (ni) picks = picks.filter(t => t.kind !== 'volcano');
  let d = addDays(TODAY, 10);
  const items = picks.slice(0,3).map(t => {
    let tries = 0; while (seats(t.id, keyOf(d)) < n && tries++ < 30) d = addDays(d, 1);
    const it = { id:t.id, k:keyOf(d), ad, ni, left:seats(t.id, keyOf(d)) };
    d = addDays(d, t.kind === 'lagoon' ? 2 : 1); return it;
  });
  return items;
}
function planHTML(items) {
  const total = coTotal(items);
  return `<p style="margin-bottom:8px">Con base en lo que me dijiste, esto es lo que te recomiendo. Todas las fechas tienen cupo ahora mismo:</p>
  ${items.map((it,i) => { const t = tourById(it.id); return `<div class="pday"><span class="d">Día ${i+1}<br>${nice(it.k)}</span><span class="th">${scene(t)}</span><div><b>${esc(t.t)}</b><span class="s">quedan ${it.left} lugares · ${t.dur}</span></div><b class="num">${fmt(it.ad*t.adulto+it.ni*t.nino)}</b></div>`; }).join('')}
  <div class="total" style="margin-top:6px"><span class="note">${items[0].ad} adultos${items[0].ni?` + ${items[0].ni} niños`:''} · total</span><b class="num">${fmt(total)}</b></div>
  <div class="qr" style="margin-top:12px"><button class="btn btn-mola" style="border:0;color:#fff;background:var(--mola)" data-a="agentBook">Reservar todo · ${fmt(total)}</button><button data-a="agentHuman">Prefiero hablar con una persona</button><button data-a="agentRestart">Empezar de nuevo</button></div>`;
}
function answer(val, label) {
  const c = S.chat; if (c.typing || c.step > 2) return;
  c.msgs.forEach(m => m.opts = null);
  c.msgs.push({ from:'me', html:esc(label) });
  c.ans[Q[c.step].key] = val; c.step++; c.typing = true; render();
  setTimeout(() => {
    c.typing = false;
    if (c.step < 3) { const q = Q[c.step]; c.msgs.push({ from:'bot', html:esc(q.ask), opts:q.opts }); }
    else { c.plan = buildPlan(c.ans); c.msgs.push({ from:'bot', plan:true, html:planHTML(c.plan) }); }
    render();
  }, c.step < 3 ? 700 : 1500);
}
function parseFree(text) {
  const s = text.toLowerCase(), st = S.chat.step;
  if (st === 0) return /playa|isla|mar|san blas|caribe/.test(s) ? 'playa' : /selva|monta|volc|cascad|naturaleza|fr[ií]o/.test(s) ? 'naturaleza' : /ciudad|canal|cultura|historia|casco/.test(s) ? 'ciudad' : 'mix';
  if (st === 1) return /famil|hij|niñ|niñ/.test(s) ? 'familia' : /amig/.test(s) ? 'amigos' : /\bsol[oa]\b/.test(s) ? 'solo' : 'pareja';
  if (st === 2) { const n = Number((s.match(/\d[\d,.]*/)||[''])[0].replace(/[,.]/g,'')); return /sin|no importa|lo que sea/.test(s) || !n ? '9999' : n <= 200 ? '200' : n <= 450 ? '450' : '9999'; }
  return null;
}
function renderAgent() {
  if (!S.chat) chatInit();
  const c = S.chat, a = c.ans;
  const stepState = i => c.step > i || (i===3 && c.plan) ? 'done' : c.step === i ? 'now' : '';
  return `<div class="wrap agent">
    <section class="chat" aria-label="Chat con el agente">
      <div class="chat-h"><div class="avatar" style="color:#fff">${compass}</div><div><b>Agente de viaje Travy</b><small>● En línea · responde en español e inglés</small></div></div>
      <div class="msgs" id="msgs">
        ${c.msgs.map(m => `<div class="msg ${m.from} ${m.plan?'plan':''} fade">${m.html}${m.opts?`<div class="qr" style="margin-top:10px">${m.opts.map(([l,v])=>`<button data-a="ans" data-v="${v}" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>`:''}</div>`).join('')}
        ${c.typing ? `<div class="msg bot"><div class="typing"><i></i><i></i><i></i></div></div>` : ''}
      </div>
      <form class="composer" id="composer"><input class="inp-box" id="chat-in" placeholder="${c.step<3?'O escríbelo con tus palabras…':'Pídele un cambio al itinerario…'}" autocomplete="off"><button class="btn btn-sea" type="submit">Enviar</button></form>
    </section>
    <aside class="side">
      <div class="panel"><h4>Cómo trabaja el agente</h4>
        <div class="step ${stepState(0)}"><span class="n">1</span><p>Entiende qué buscas<small>Clima, acompañantes y presupuesto, aunque lo escribas a tu manera</small></p></div>
        <div class="step ${c.step>=3?'done':c.step>0?'now':''}"><span class="n">2</span><p>Consulta el catálogo en vivo<small>${tours.filter(t=>t.pub).length} tours publicados, precios y lugares por fecha</small></p></div>
        <div class="step ${c.plan?'done':''}"><span class="n">3</span><p>Arma el plan y la liga de pago<small>Solo propone fechas con cupo real</small></p></div>
      </div>
      <div class="panel"><h4>Lo que entendió</h4>
        <div class="kv"><span>Estilo</span><b class="${a.vibe?'':'pending'}">${a.vibe?LBL[a.vibe]:'—'}</b></div>
        <div class="kv"><span>Viajeros</span><b class="${a.who?'':'pending'}">${a.who?LBL[a.who]:'—'}</b></div>
        <div class="kv"><span>Presupuesto</span><b class="${a.budget?'':'pending'}">${a.budget?LBL[a.budget]:'—'}</b></div>
      </div>
      <div class="panel"><h4>También por WhatsApp</h4><p class="note">El mismo agente puede contestar en el número del negocio y pasar la conversación a una persona cuando haga falta.</p></div>
    </aside>
  </div>`;
}

/* ---------- admin ---------- */
const pill = s => `<span class="pill p-${s.toLowerCase()}">${s}</span>`;
function waMsg(l) { const t = tourById(l.tour); return `Hola ${l.n.split(' ')[0]}, soy de Travy. Vi tu interés en "${t.t}" para el ${nice(l.fecha)}. ¿Te comparto la cotización?`; }
function renderAdmin() {
  const ingresos = reservas.reduce((s,r)=>s+r.total,0);
  const tab = S.adminTab;
  let content = '';
  if (tab === 'leads') {
    content = `<div class="tbl-wrap"><table><thead><tr><th>Contacto</th><th>Tour</th><th>Fecha</th><th>Personas</th><th>Origen</th><th>Estado</th><th></th></tr></thead><tbody>
      ${leads.map((l,i) => `<tr class="${S.freshLead===l?'fresh':''}"><td><b>${esc(l.n)}</b><br><span class="note num">${esc(l.tel)} · ${l.t}</span></td><td>${esc(tourById(l.tour).t)}</td><td class="num">${nice(l.fecha)}</td><td class="num">${l.ad}${l.ni?` + ${l.ni}`:''}</td><td>${esc(l.src)}</td>
      <td><label class="sr" hidden for="st-${i}">Estado</label><select class="sel-mini" id="st-${i}" data-lead="${i}">${['Nuevo','Contactado','Cotizado','Cerrado','Perdido'].map(s=>`<option ${l.est===s?'selected':''}>${s}</option>`).join('')}</select> ${pill(l.est)}</td>
      <td><a class="wa-link" href="https://wa.me/?text=${encodeURIComponent(waMsg(l))}" target="_blank" rel="noopener">Responder ↗</a></td></tr>`).join('')}
    </tbody></table></div>`;
  } else if (tab === 'reservas') {
    content = `<div class="tbl-wrap"><table><thead><tr><th>Folio</th><th>Cliente</th><th>Tours</th><th>Método</th><th>Total</th><th>Estado</th><th>Creada</th></tr></thead><tbody>
      ${reservas.map(r => `<tr class="${S.freshRes===r.folio?'fresh':''}"><td class="num"><b>${r.folio}</b></td><td>${esc(r.n)}</td><td>${r.items.map(it=>`${esc(tourById(it.id).t)} <span class="note num">· ${nice(it.k)} · ${it.ad+it.ni} pax</span>`).join('<br>')}</td><td>${r.met}</td><td class="num"><b>${fmt(r.total)}</b></td><td>${pill(r.est)}</td><td class="note">${r.t}</td></tr>`).join('')}
    </tbody></table></div>`;
  } else {
    content = `${S.showNew ? `<form class="newform fade" id="newTour">
      <div class="f"><label class="lbl" for="n-t">Nombre del tour</label><input class="inp-box" id="n-t" required value="Isla Taboga: playa y pueblo"></div>
      <div class="f"><label class="lbl" for="n-d">Destino</label><input class="inp-box" id="n-d" required value="Isla Taboga"></div>
      <div class="f"><label class="lbl" for="n-c">Categoría</label><select class="inp-box" id="n-c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="f"><label class="lbl" for="n-p">Precio adulto</label><input class="inp-box num" id="n-p" type="number" min="1" value="79" required></div>
      <div class="f"><label class="lbl" for="n-k">Portada</label><select class="inp-box" id="n-k"><option value="sea">Playa</option><option value="sail">Barco</option><option value="jungle">Selva</option><option value="city">Ciudad</option><option value="falls">Cascada</option></select></div>
      <button class="btn btn-mola" type="submit">Publicar</button></form>` : ''}
      <div class="tbl-wrap"><table><thead><tr><th></th><th>Tour</th><th>Categoría</th><th>Precio adulto (USD)</th><th>Reseñas</th><th>Publicado</th></tr></thead><tbody>
      ${tours.map(t => `<tr><td><span class="thumb">${scene(t)}</span></td><td><b>${esc(t.t)}</b><br><span class="note">${esc(t.dest)} · ${t.dur}</span></td><td>${t.cat}</td>
      <td><input class="price-in" type="number" min="1" id="pr-${t.id}" data-price="${t.id}" value="${t.adulto}" aria-label="Precio de ${esc(t.t)}"></td><td class="num">★ ${t.rating} · ${t.rev}</td>
      <td><label class="switch"><input type="checkbox" id="pub-${t.id}" data-pub="${t.id}" ${t.pub?'checked':''} aria-label="Publicar ${esc(t.t)}"><span></span></label></td></tr>`).join('')}
      </tbody></table></div>`;
  }
  return `<div class="wrap admin fade">
    <div class="admin-top"><div><span class="eyebrow">Panel de Travy</span><h2 style="margin-top:8px">Buenos días, equipo</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-line" data-a="view" data-v="sitio">Ver sitio</button><button class="btn btn-mola" data-a="newTour">+ Nuevo tour</button></div></div>
    <div class="kpis">
      <div class="kpi"><span>Leads esta semana</span><b class="num">${leads.length + 31}</b><small>+18% vs semana pasada</small></div>
      <div class="kpi"><span>Reservas pagadas</span><b class="num">${reservas.length + 9}</b><small>${reservas.length} en las últimas 48 h</small></div>
      <div class="kpi"><span>Ingresos del mes</span><b class="num">${fmt(ingresos + 6840)}</b><small>USD · Yappy 52%</small></div>
      <div class="kpi"><span>Tours publicados</span><b class="num">${tours.filter(t=>t.pub).length}</b><small style="color:var(--muted)">de ${tours.length} en catálogo</small></div>
    </div>
    <div class="subtabs" role="tablist">
      <button role="tab" data-a="atab" data-t="leads" aria-selected="${tab==='leads'}">Leads<span class="cnt">${leads.length}</span></button>
      <button role="tab" data-a="atab" data-t="reservas" aria-selected="${tab==='reservas'}">Reservas<span class="cnt">${reservas.length}</span></button>
      <button role="tab" data-a="atab" data-t="tours" aria-selected="${tab==='tours'}">Tours y precios<span class="cnt">${tours.length}</span></button>
    </div>
    ${content}
    <p class="note" style="margin-top:12px">Los cambios de precio y publicación se reflejan en el sitio al instante. Cifras de ejemplo.</p>
  </div>`;
}

/* ---------- roadmap / proposal ---------- */
function renderRoadmap() {
  return `<div class="wrap rm fade">
    <div class="rm-head"><span class="eyebrow">Propuesta · plataforma de tours en Panamá</span>
      <h1>Un sitio que vende mientras ustedes están en la lancha.</h1>
      <p>Se construye por niveles. Cada nivel queda en línea y funcionando antes de empezar el siguiente, así el negocio empieza a recibir clientes desde las primeras semanas.</p></div>
    <div class="levels">
      <div class="level core"><div class="lvl"><b>A</b><span>Captar clientes<br>≈ 3–4 semanas</span></div><h3>Catálogo + WhatsApp</h3>
        <p>La base: un catálogo rápido y fácil de administrar que convierte visitas en conversaciones.</p>
        <ul><li>Catálogo con filtros por destino y experiencia</li><li>Ficha de tour con itinerario, incluye y reseñas</li><li>Cotización que abre WhatsApp con el mensaje listo</li><li>Panel para editar tours, precios y ver leads</li><li>Sitio en español e inglés, listo para Google</li></ul>
        <div class="cost"><b>$10,000</b><span>pago único</span><span>+ <em>$3,000</em> de mantenimiento mensual</span></div>
        <button class="btn btn-ghost" data-a="demoA">Ver en la demo</button></div>
      <div class="level"><div class="lvl"><b>B</b><span>Cobrar en línea<br>≈ +3–4 semanas</span></div><h3>Reservas y pagos</h3>
        <p>El sitio cobra solo y controla cuántos lugares quedan por fecha.</p>
        <ul><li>Calendario con cupos reales por salida</li><li>Pago con Yappy, tarjeta y PayPal</li><li>Descuento automático de cupos al confirmarse el pago</li><li>Correo de confirmación con folio</li><li>Reservas en el panel</li></ul>
        <div class="cost"><b>$20,000</b><span>pago único</span><span>+ <em>$3,000</em> de mantenimiento mensual</span></div>
        <button class="btn btn-ghost" data-a="demoB">Ver en la demo</button></div>
      <div class="level"><div class="lvl"><b>C</b><span>Vender 24/7<br>≈ +3–5 semanas</span></div><h3>Agente de viaje con IA</h3>
        <p>Un asistente que pregunta, recomienda y cierra la venta, en web y WhatsApp.</p>
        <ul><li>Entiende preferencias en lenguaje natural</li><li>Arma itinerarios con tours y fechas con cupo</li><li>Genera la liga de pago del plan completo</li><li>Pasa la conversación a una persona cuando hace falta</li></ul>
        <div class="cost"><b>$35,000</b><span>pago único</span><span>+ <em>$3,000</em> de mantenimiento mensual</span></div>
        <button class="btn btn-ghost" data-a="view" data-v="agente">Ver en la demo</button></div>
    </div>
  </div>`;
}

/* ---------- render + events ---------- */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === S.view));
  const app = $('#app');
  if (S.view === 'sitio') app.innerHTML = S.route ? renderDetail(tourById(S.route)) : renderHome();
  else if (S.view === 'agente') app.innerHTML = renderAgent();
  else if (S.view === 'admin') app.innerHTML = renderAdmin();
  else app.innerHTML = renderRoadmap();
  const msgs = $('#msgs'); if (msgs) msgs.scrollTop = msgs.scrollHeight;
}
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
function openTour(id) { S.view = 'sitio'; S.route = id; S.sel = null; S.cal = null; S.quote = { sent:false }; S.bookTab = 'reservar'; window.scrollTo(0,0); render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'scrim' && e.target !== el) return;
  switch (a) {
    case 'view': S.checkout = null; renderModal(); view(el.dataset.v); break;
    case 'home': S.route = null; S.view = 'sitio'; window.scrollTo(0,0); render(); break;
    case 'open': openTour(Number(el.dataset.id)); break;
    case 'cat': S.filter.cat = el.dataset.c; render(); break;
    case 'clear': S.filter = { dest:'', cat:'' }; render(); break;
    case 'btab': S.bookTab = el.dataset.t; render(); break;
    case 'mon': { const d = new Date(S.cal.y, S.cal.m + Number(el.dataset.d), 1); S.cal = { y:d.getFullYear(), m:d.getMonth() }; render(); break; }
    case 'day': S.sel = el.dataset.k; render(); break;
    case 'pax': { const k = el.dataset.k; S[k] = Math.max(k==='ad'?1:0, Math.min(12, S[k] + Number(el.dataset.d))); render(); break; }
    case 'requote': S.quote = { sent:false }; render(); break;
    case 'checkout': openCheckout([{ id:S.route, k:S.sel, ad:S.ad, ni:S.ni }]); break;
    case 'met': S.checkout.met = el.dataset.m; renderModal(); break;
    case 'pay': doPay(); break;
    case 'scrim': case 'closeM': { const then = el.dataset.then; S.checkout = null; renderModal(); if (then) { S.adminTab = 'reservas'; view(then); } else render(); break; }
    case 'ans': if (el.dataset.v === '__restart') { chatInit(); render(); break; } answer(el.dataset.v, el.dataset.l); break;
    case 'agentBook': openCheckout(S.chat.plan.map(({id,k,ad,ni}) => ({id,k,ad,ni}))); break;
    case 'agentHuman': {
      const c = S.chat; c.msgs.push({ from:'me', html:'Prefiero hablar con una persona' });
      const txt = `Hola, el agente me armó este plan: ${c.plan.map(it=>`${tourById(it.id).t} (${nice(it.k)})`).join(', ')}. ¿Me ayudan a cerrarlo?`;
      c.msgs.push({ from:'bot', html:`Claro. Te paso con el equipo por WhatsApp con tu plan ya escrito, para que no repitas nada.<div class="qr" style="margin-top:10px"><a class="btn btn-wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Abrir WhatsApp</a></div>` });
      leads.unshift({ n:'Visitante del chat', tel:'vía agente IA', tour:c.plan[0].id, fecha:c.plan[0].k, ad:c.plan[0].ad, ni:c.plan[0].ni, est:'Nuevo', t:'ahora', src:'Agente IA' });
      S.freshLead = leads[0]; render(); break;
    }
    case 'agentRestart': chatInit(); render(); break;
    case 'atab': S.adminTab = el.dataset.t; render(); break;
    case 'newTour': S.adminTab = 'tours'; S.showNew = !S.showNew; render(); break;
    case 'demoA': S.bookTab = 'cotizar'; openTour(1); S.bookTab = 'cotizar'; render(); break;
    case 'demoB': openTour(1); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'searchForm') { S.filter = { dest:$('#f-dest').value, cat:$('#f-cat').value }; render(); $('#catalogo')?.scrollIntoView({ behavior:'smooth' }); }
  if (f.id === 'quoteForm') {
    const t = tourById(S.route), name = $('#q-name').value.trim() || 'Cliente', k = $('#q-date').value;
    const pax = `${S.ad} adulto${S.ad>1?'s':''}${S.ni?` y ${S.ni} niño${S.ni>1?'s':''}`:''}`;
    const msg = `Hola Travy, me interesa el tour "${t.t}" para ${pax} el ${nice(k)}. Mi nombre es ${name}.`;
    const lead = { n:name, tel:'+507 6000-0000', tour:t.id, fecha:k, ad:S.ad, ni:S.ni, est:'Nuevo', t:'ahora', src:'Sitio web' };
    leads.unshift(lead); S.freshLead = lead; S.quote = { sent:true, msg }; render(); toast('Lead guardado en el panel');
  }
  if (f.id === 'composer') {
    const inp = $('#chat-in'), v = inp.value.trim(); if (!v) return;
    const c = S.chat;
    if (c.step < 3) { answer(parseFree(v), v); }
    else { c.msgs.push({ from:'me', html:esc(v) }); c.typing = true; render();
      setTimeout(() => { c.typing = false; c.msgs.push({ from:'bot', html:'Entendido. En la versión real ajusto el plan con tu comentario, consultando otra vez precios y cupos. En esta demo puedes empezar de nuevo para probar otra combinación.', opts:[['Empezar de nuevo','__restart']] }); render(); }, 900); }
  }
  if (f.id === 'newTour') {
    const id = Math.max(...tours.map(t=>t.id)) + 1, kind = $('#n-k').value;
    const pals = { sea:tours[0].pal, sail:tours[2].pal, jungle:tours[5].pal, city:tours[6].pal, falls:tours[3].pal };
    const p = Number($('#n-p').value);
    tours.push({ id, t:$('#n-t').value, dest:$('#n-d').value, cat:$('#n-c').value, adulto:p, nino:Math.round(p*.7), dur:'1 día', kind, pal:pals[kind], tag:'Nuevo', vibe:'playa', rating:5.0, rev:0, pub:true,
      desc:'Tour recién publicado desde el panel.', inc:['Transporte','Guía'], no:['Comidas'], itin:[['8:00','Salida'],['16:00','Regreso']] });
    S.showNew = false; render(); toast('Tour publicado en el sitio');
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.lead) { leads[Number(el.dataset.lead)].est = el.value; render(); toast('Estado actualizado'); }
  if (el.dataset.price) { const t = tourById(Number(el.dataset.price)); t.adulto = Math.max(1, Number(el.value) || t.adulto); toast(`Nuevo precio de ${t.t}: ${fmt(t.adulto)}`); }
  if (el.dataset.pub) { const t = tourById(Number(el.dataset.pub)); t.pub = el.checked; render(); toast(t.pub ? 'Tour visible en el sitio' : 'Tour oculto del sitio'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.checkout) { S.checkout = null; renderModal(); render(); } });

render();
})();
</script>
